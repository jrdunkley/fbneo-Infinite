name: Source package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_source.py
      - run: python -m py_compile build.py package.py tools/verify_source.py
